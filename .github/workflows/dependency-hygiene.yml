name: Dependency Hygiene

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Validate locked application dependencies
        run: npm ci --ignore-scripts
      - name: Validate Python requirement resolution
        run: python3 -m pip install --dry-run -r requirements-qa.txt
